name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      # Pinned to the commit, not the tag: a tag can move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix fmt -- --ci
      # Every output is evaluated, and the checks are built: they are the only tests of the compiled-in plugin path and of the
      # launchers. The packages are not built here; a cache job does that later.
      - run: nix flake check --no-build --all-systems
      # Every check the flake declares for this system is built, so a new check cannot be left out.
      - run: |
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          checks=$(nix eval --raw ".#checks.$system" --apply 'cs: builtins.concatStringsSep " " (builtins.attrNames cs)')
          for check in $checks; do
            nix build ".#checks.$system.$check" --print-build-logs
          done

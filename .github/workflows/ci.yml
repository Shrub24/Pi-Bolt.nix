name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix fmt -- --ci
      # Evaluation only: building every output belongs to the cache job, when there is one. The plugin contract is built here
      # because it is the only check of the compiled-in plugin path.
      - run: nix flake check --no-build --all-systems
      - run: nix build ".#checks.$(nix eval --impure --raw --expr builtins.currentSystem).plugins" --print-build-logs

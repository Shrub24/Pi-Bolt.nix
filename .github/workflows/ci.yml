name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      # Pinned to the commit, not the tag: a tag can move.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - run: nix fmt -- --ci
      # Every output is evaluated, and the checks are built: they are the only tests of the compiled-in plugin path and of the
      # launchers. The packages are not built here; a cache job does that later.
      - run: nix flake check --no-build --all-systems
      - run: nix build ".#checks.$(nix eval --impure --raw --expr builtins.currentSystem)."{plugins,launcher,plugin-builder,jit,pi-bolt-example} --print-build-logs
